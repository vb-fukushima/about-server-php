<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300" font-family="'Hiragino Sans', 'Noto Sans JP', sans-serif">
  <defs>
    <marker id="svd-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="640" height="300" fill="#ffffff" rx="12"/>

  <!-- 静的サイト -->
  <text x="20" y="28" font-size="14" fill="#0f172a" font-weight="bold">静的サイト</text>

  <rect x="15" y="45" width="270" height="130" rx="10" fill="#f1f5f9" stroke="#1e293b" stroke-width="2"/>
  <text x="150" y="68" text-anchor="middle" font-size="13" fill="#334155" font-weight="bold">サーバーに置いてあるファイル</text>
  <text x="150" y="95" text-anchor="middle" font-size="14" fill="#0f172a" font-family="monospace">index.html</text>
  <text x="150" y="118" text-anchor="middle" font-size="14" fill="#0f172a" font-family="monospace">style.css</text>
  <text x="150" y="141" text-anchor="middle" font-size="14" fill="#0f172a" font-family="monospace">script.js</text>
  <text x="150" y="163" text-anchor="middle" font-size="11" fill="#64748b">↑ このまま毎回同じ内容を返す</text>

  <line x1="150" y1="185" x2="150" y2="215" stroke="#334155" stroke-width="2" marker-end="url(#svd-arrow)"/>
  <text x="150" y="240" text-anchor="middle" font-size="12" fill="#334155">誰がアクセスしても同じHTML</text>

  <!-- 動的サイト -->
  <text x="345" y="28" font-size="14" fill="#0f172a" font-weight="bold">動的サイト</text>

  <rect x="340" y="45" width="285" height="130" rx="10" fill="#f1f5f9" stroke="#1e293b" stroke-width="2"/>
  <text x="482" y="68" text-anchor="middle" font-size="13" fill="#334155" font-weight="bold">サーバーに置いてあるファイル</text>
  <text x="482" y="95" text-anchor="middle" font-size="14" fill="#0f172a" font-family="monospace">index.php</text>
  <text x="482" y="118" text-anchor="middle" font-size="14" fill="#0f172a" font-family="monospace">style.css</text>
  <text x="482" y="141" text-anchor="middle" font-size="14" fill="#0f172a" font-family="monospace">script.js</text>
  <text x="482" y="163" text-anchor="middle" font-size="11" fill="#64748b">↑ PHPがそのつどHTMLを作る</text>

  <line x1="482" y1="185" x2="482" y2="215" stroke="#334155" stroke-width="2" marker-end="url(#svd-arrow)"/>
  <text x="482" y="240" text-anchor="middle" font-size="12" fill="#334155">アクセスごとに内容が変わるHTML</text>
</svg>

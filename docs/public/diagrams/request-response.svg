<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 290" width="640" height="290" font-family="'Hiragino Sans', 'Noto Sans JP', sans-serif">
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="640" height="290" fill="#ffffff" rx="12"/>

  <text x="20" y="28" font-size="14" fill="#0f172a" font-weight="bold">① クライアントとサーバーの基本的なやりとり</text>

  <!-- クライアント(ブラウザ) -->
  <rect x="15" y="110" width="200" height="100" rx="10" fill="#f1f5f9" stroke="#1e293b" stroke-width="2"/>
  <text x="115" y="150" text-anchor="middle" font-size="16" fill="#0f172a" font-weight="bold">クライアント(ブラウザ)</text>
  <text x="115" y="175" text-anchor="middle" font-size="12" fill="#334155">パソコンやスマホのブラウザ</text>

  <!-- サーバー -->
  <rect x="425" y="110" width="200" height="100" rx="10" fill="#f1f5f9" stroke="#1e293b" stroke-width="2"/>
  <text x="525" y="150" text-anchor="middle" font-size="18" fill="#0f172a" font-weight="bold">サーバー</text>
  <text x="525" y="175" text-anchor="middle" font-size="13" fill="#334155">(PHPが動いている)</text>

  <!-- リクエスト矢印(上向き, クライアント→サーバー) -->
  <line x1="220" y1="135" x2="420" y2="135" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <text x="320" y="120" text-anchor="middle" font-size="14" fill="#2563eb" font-weight="bold">リクエスト</text>
  <text x="320" y="100" text-anchor="middle" font-size="12" fill="#475569">URLにアクセス・フォーム送信など</text>

  <!-- レスポンス矢印(下向き, サーバー→クライアント) -->
  <line x1="420" y1="190" x2="220" y2="190" stroke="#16a34a" stroke-width="3" marker-end="url(#arrow-green)"/>
  <text x="320" y="215" text-anchor="middle" font-size="14" fill="#16a34a" font-weight="bold">レスポンス</text>
  <text x="320" y="235" text-anchor="middle" font-size="12" fill="#475569">HTML・データなど</text>
</svg>
